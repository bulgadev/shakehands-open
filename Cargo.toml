[package]
name = "shakehands"
version = "0.1.0"
edition = "2024"
description = "A Linux evdev debounce service for flaky input devices"
license = "MIT"

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
evdev = "0.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"
